services:
  be-data-analysis:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:7890
        HTTPS_PROXY: http://127.0.0.1:7890
        http_proxy: http://127.0.0.1:7890
        https_proxy: http://127.0.0.1:7890
        NO_PROXY: localhost,127.0.0.1,::1

    image: be-data-analysis:local
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    init: true

    env_file:
      - .env.prod

    environment:
      APP_ENV: prod
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8000

    ports:
      - "18801:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - /data/logs/be-data-analysis:/app/logs

    command:
      - sh
      - -c
      - exec python -m app serve >> /app/logs/service.log 2>&1
