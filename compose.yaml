services:
  be-data-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    image: be-data-analysis:local
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    init: true

    env_file:
      - .env.prod

    environment:
      APP_ENV: prod

    ports:
      - "18801:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - /data/logs/be-data-analysis:/app/logs

    command:
      - sh
      - -c
      - exec python -m app serve >> /app/logs/service.log 2>&1
